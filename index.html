<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Blackbird White Noise</title>
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .container { text-align: center; }
    h1 { font-size: 4rem; font-weight: 300; letter-spacing: 2px; margin-bottom: 0.5rem; }
    #status { font-size: 1.5rem; color: #888; font-weight: 300; }
  </style>
</head>
<body>


  <!-- DEFENSE 1: We switched to a <video> tag instead of <audio>. Android TV NEVER runs screensavers over video elements. -->
  <video id="stealth-audio-player" preload="auto" style="display:none;"></video>
  
  <!-- DEFENSE 2: We inject a completely invisible, perfectly silent, 1x1 pixel black MP4 video that literally loops forever. The TV hardware thinks you are actively watching a movie! -->
  <video id="dummy-video" autoplay loop muted playsinline style="display:none;" src="assets/dummy.mp4"></video>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
