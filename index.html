<!DOCTYPE html>
<html>
<head>
    <title>Black Screen Receiver</title>
    <style>
        body { 
            background-color: black; 
            margin: 0; 
            overflow: hidden; 
        }
    </style>
    <!-- Load the Google Cast Receiver SDK -->
    <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
    <!-- 
      We are completely deleting the <cast-media-player> tag!
      Instead, we use a raw HTML5 audio tag that has absolutely zero visual UI.
    -->
    <audio id="stealth-audio-player" loop></audio>

    <script>
        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();
        
        // Explicitly tell the Cast Framework to pipe the audio into our invisible audio tag
        // rather than spawning its default giant blue UI player.
        playerManager.setMediaElement(document.getElementById('stealth-audio-player'));

        const options = new cast.framework.CastReceiverOptions();
        options.disableIdleTimeout = true; 
        
        context.start(options);
    </script>
</body>
</html>
