    <script>
        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();
        
        playerManager.setMediaElement(document.getElementById('stealth-audio-player'));
        
        const options = new cast.framework.CastReceiverOptions();
        options.disableIdleTimeout = true; 
        context.start(options);

        // DEFENSE 3: Modern Web Wake Lock API (If Chromecast OS supports it, this is a native override)
        async function keepAwake() {
            try {
                if ('wakeLock' in navigator) {
                    const wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => keepAwake()); // Infinitely request the lock
                }
            } catch (err) {}
        }
        keepAwake();
    </script>
